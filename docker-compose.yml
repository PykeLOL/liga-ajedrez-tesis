services:
  # --- BACKEND ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess_backend
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - chess-network

  backend-server:
    image: nginx:alpine
    container_name: chess_backend_server
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - chess-network

  # --- FRONTEND ---
  frontend:
    build:
      context: ../liga-ajedrez-tesis-front
      dockerfile: Dockerfile
    container_name: chess_frontend
    restart: unless-stopped
    volumes:
      - ../liga-ajedrez-tesis-front:/var/www
    networks:
      - chess-network

  frontend-server:
    image: nginx:alpine
    container_name: chess_frontend_server
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8001}:80"
    volumes:
      - ../liga-ajedrez-tesis-front:/var/www
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    networks:
      - chess-network

  # --- BASE DE DATOS ---
  db:
    image: postgres:16
    container_name: chess_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chess_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5499}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chess-network

networks:
  chess-network:
    driver: bridge

volumes:
  pgdata: