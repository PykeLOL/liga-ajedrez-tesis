version: '3.8'

services:
  # --- BACKEND ---
  backend:
    build:
      context: .             
      dockerfile: Dockerfile
    container_name: chess_backend
    restart: unless-stopped
    volumes:
      - .:/var/www          
    networks:
      - chess-network

  backend-server:
    image: nginx:alpine
    container_name: chess_backend_server
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www           
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - chess-network

  # --- FRONTEND ---
  frontend:
    build:
      context: ../frontend    
      dockerfile: Dockerfile
    container_name: chess_frontend
    restart: unless-stopped
    volumes:
      - ../frontend:/var/www  
    networks:
      - chess-network

  frontend-server:
    image: nginx:alpine
    container_name: chess_frontend_server
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../frontend:/var/www  
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    networks:
      - chess-network

  # --- BASE DE DATOS ---
  db:
    image: postgres:16
    container_name: chess_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chess_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chess-network

networks:
  chess-network:
    driver: bridge

volumes:
  pgdata: